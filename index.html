    <script>
        const DRIVE_PDF_URL = "https://drive.google.com/file/d/1tPdsfPZVt-oOM-a1YmCbr8oMPMprzbl2/view?usp=sharing";
        const DRIVE_VIDEO_URL = "https://drive.google.com/file/d/1SIK91sRhpQ3Xs2uipNnDh0MSYUlOl2ux/view?usp=sharing";

        // PRINCIPAL (Práctica + Repaso)
        const quizData = [
            { question: 'Teorías del Origen de la Tierra <br> Un estudiante debe explicar cómo se formó el sistema solar según la teoría nebular. ¿Qué plantea esta teoría?', options: ['La Tierra se formó por la acumulación progresiva de polvo cósmico y bombardeo espacial.', 'Un ser divino creó el mundo desde la nada en siete días.', 'El universo se originó por una gran explosión que dispersó materia por el espacio.', 'Una nebulosa en rotación se contrajo, concentrando partículas pesadas en el centro.'], answer: 'Una nebulosa en rotación se contrajo, concentrando partículas pesadas en el centro.', explanation: 'Respuesta correcta: D <br> A) Incorrecta. Describe la teoría de la acreción (acumulación de polvo y bombardeo), no la nebular. <br> B) Incorrecta. Es la teología de la creación (visión religiosa). <br> C) Incorrecta. Es la teoría del Big Bang (origen del universo). <br> D) Correcta. La teoría nebular (Kant-Laplace) plantea que una nebulosa en rotación se contrajo por gravedad, concentrando materia pesada en el centro (formando el Sol) y formando un disco del que surgieron los planetas.', multi: 'OFF', maxSelect: 1 },
            { question: 'Origen de la Tierra y Teorías Científicas <br> Lea los siguientes enunciados y seleccione la opción que los clasifique correctamente como verdaderos (V) o falsos (F). <br> 1. La teoría del Big Bang sostiene que el universo se originó por una gran explosión. <br> 2. La teoría de Laplace propone que una nebulosa se contrajo por la gravedad y desprendió anillos concéntricos. <br> 3. La teoría de la acreción explica la formación planetaria por la acumulación de polvo cósmico. <br> 4. La teología de la creación fue desarrollada exclusivamente por Charles Darwin.', options: ['V, V, V, F', 'F, V, V, F', 'V, F, F, V', 'F, F, V, V'], answer: 'V, V, V, F', explanation: 'Respuesta correcta: A) V, V, V, F <br> 1. V – El Big Bang describe el origen del universo por una gran explosión/expansión. <br> 2. V – Laplace propuso que una nebulosa se contrajo y desprendió anillos concéntricos que formaron planetas. <br> 3. V – La teoría de la acreción explica la formación de planetas por acumulación de polvo cósmico. <br> 4. F – La teología de la creación es religiosa (San Agustín, Tomás de Aquino); Darwin desarrolló la selección natural.', multi: 'OFF', maxSelect: 1 },
            { question: 'Estructura Interna de la Tierra <br> Sobre la estructura interna de la Tierra, es correcto afirmar que:', options: ['El núcleo terrestre está compuesto principalmente por silicio y aluminio.', 'El manto es la capa más externa del planeta y forma la corteza terrestre.', 'El núcleo interno es sólido y está compuesto principalmente por hierro y níquel.', 'La litosfera es una capa líquida que se encuentra debajo de la astenosfera.'], answer: 'El núcleo interno es sólido y está compuesto principalmente por hierro y níquel.', explanation: 'Respuesta correcta: C <br> A) Incorrecta. El núcleo es principalmente hierro y níquel; el silicio y aluminio dominan en la corteza. <br> B) Incorrecta. El manto está debajo de la corteza; la corteza es la capa más externa. <br> C) Correcta. El núcleo interno es sólido (hierro-níquel). <br> D) Incorrecta. La litosfera es rígida (corteza + manto superior); la astenosfera es más plástica debajo.', multi: 'OFF', maxSelect: 1 },
            { question: 'Atmósfera y sus Capas <br> La troposfera es a las nubes y tormentas como la estratosfera es a:', options: ['Las auroras polares y la órbita de satélites.', 'La desintegración de meteoritos y estrellas fugaces.', 'La capa de ozono que filtra la radiación ultravioleta.', 'La dispersión de gases hacia el espacio exterior.'], answer: 'La capa de ozono que filtra la radiación ultravioleta.', explanation: 'Respuesta correcta: C <br> A) Incorrecta. Auroras y satélites están en la termosfera. <br> B) Incorrecta. Desintegración de meteoritos ocurre en la mesosfera. <br> C) Correcta. La estratosfera contiene la capa de ozono que filtra UV. <br> D) Incorrecta. Dispersión de gases ocurre en capas superiores (exosfera).', multi: 'OFF', maxSelect: 1 },
            { question: 'Capas de la Atmósfera <br> Identifique la opción que NO corresponde a una de las capas de la atmósfera terrestre.', options: ['Troposfera.', 'Estratosfera.', 'Mesosfera.', 'Litosfera.'], answer: 'Litosfera.', explanation: 'Respuesta correcta: D <br> La litosfera es parte de la geosfera (estructura sólida), no de la atmósfera. Troposfera, estratosfera y mesosfera sí son capas atmosféricas.', multi: 'OFF', maxSelect: 1 },
            { question: 'Formación de Pangea <br> Ordene las palabras para formar una oración correcta sobre la formación de Pangea. <br> Pangea / supercontinente / llamado / toda / terrestre / un / formaba / única / la / masa /.', options: ['Toda la masa terrestre formaba un único supercontinente llamado Pangea.', 'Un único supercontinente llamado Pangea formaba toda la masa terrestre.', 'La masa terrestre formaba un único supercontinente llamado Pangea.', 'Formaba un único supercontinente llamado Pangea toda la masa terrestre.'], answer: 'Toda la masa terrestre formaba un único supercontinente llamado Pangea.', explanation: 'Respuesta correcta: A <br> La oración correcta y natural es: “Toda la masa terrestre formaba un único supercontinente llamado Pangea.” Las demás tienen orden gramatical incorrecto o menos natural.', multi: 'OFF', maxSelect: 1 },
            { question: 'Teoría de la Deriva Continental <br> Ordene las palabras para formar una oración correcta sobre la teoría de la deriva continental. <br> Wegener / continental / deriva / la / Alfred / teoría / propuso / de / la /.', options: ['Alfred Wegener propuso la teoría de la deriva continental.', 'La teoría de la deriva continental fue propuesta por Alfred Wegener.', 'Propuso Alfred Wegener la teoría de la deriva continental.', 'De la deriva continental, Alfred Wegener propuso la teoría.'], answer: 'Alfred Wegener propuso la teoría de la deriva continental.', explanation: 'Respuesta correcta: A <br> La forma más directa y correcta es: “Alfred Wegener propuso la teoría de la deriva continental.” B también es aceptable gramaticalmente, pero A es la más natural y directa.', multi: 'OFF', maxSelect: 1 },
            { question: 'Eras Geológicas <br> Durante el Mesozoico, ocurrió un evento que provocó la extinción masiva de los dinosaurios. ¿Cuál fue la causa de esta extinción?', options: ['Una glaciación que cubrió toda la superficie terrestre.', 'Un impacto de origen extraterrestre que alteró el clima.', 'La aparición de los primeros mamíferos que compitieron con ellos.', 'La separación de África y América que cambió las corrientes oceánicas.'], answer: 'Un impacto de origen extraterrestre que alteró el clima.', explanation: 'Respuesta correcta: B <br> La extinción de los dinosaurios (final del Cretácico, Mesozoico) se asocia principalmente al impacto de un asteroide/meteorito que alteró el clima global.', multi: 'OFF', maxSelect: 1 },
            { question: 'Origen de la Vida y la Tierra <br> Lea el siguiente texto y responda la pregunta. <br> ‘’La Tierra se formó hace aproximadamente 4500 millones de años. Durante su formación, el planeta sufrió un aumento extremo de temperatura. Elementos pesados como el hierro y el uranio se fundieron para conformar el núcleo, mientras que un proceso posterior de enfriamiento dio origen a la corteza y a los primeros continentes.’’ <br> ¿Cuál fue el proceso que permitió la formación de la corteza terrestre?', options: ['El bombardeo espacial constante de meteoritos.', 'El enfriamiento progresivo de la masa incandescente.', 'La condensación del vapor de agua en la atmósfera', 'La acumulación de polvo cósmico y partículas ligeras.'], answer: 'El enfriamiento progresivo de la masa incandescente.', explanation: 'Respuesta correcta: B <br> El texto indica claramente que un proceso posterior de enfriamiento dio origen a la corteza.', multi: 'OFF', maxSelect: 1 },
            { question: 'Distribución del Agua en el Planeta <br> Según la información sobre la hidrosfera, ¿qué porcentaje del agua del planeta es agua dulce?', options: ['70%', '97.5%', '2.5%', '50%'], answer: '2.5%', explanation: 'Respuesta correcta: C) 2.5% <br> Aproximadamente el 97.5 % es agua salada y solo el 2.5 % es dulce.', multi: 'OFF', maxSelect: 1 },
            { question: 'Fuentes Históricas <br> Seleccione las dos opciones que corresponden a ejemplos de fuentes primarias para el estudio de la historia. <br> 1. Un manuscrito original escrito por un soldado durante la Primera Guerra Mundial. <br> 2. Un libro de texto que analiza las causas de la Revolución Francesa. <br> 3. Una fotografía tomada durante la construcción del ferrocarril en el siglo XIX. <br> 4. Un documental moderno sobre la vida de los antiguos romanos.', options: ['1 y 2 son correctas.', '1 y 3 son correctas.', '2 y 3 son correctas.', '3 y 4 son correctas.'], answer: '1 y 3 son correctas.', explanation: 'Respuesta correcta: B) 1 y 3 son correctas <br> Fuentes primarias: manuscrito original (1) y fotografía contemporánea al evento (3). Libro de texto y documental moderno son secundarias.', multi: 'OFF', maxSelect: 1 },
            { question: 'Características del Paleolítico <br> Seleccione las tres opciones que corresponden a características del Paleolítico. <br> 1. Los seres humanos eran nómadas y se desplazaban según las temporadas. <br> 2. La agricultura y la domesticación de animales eran las principales actividades. <br> 3. Las herramientas eran fabricadas principalmente con piedra, hueso y madera. <br> 4. Se desarrolló el arte rupestre con representaciones de animales y escenas de caza. <br> 5. Se construyeron grandes ciudades y monumentos megalíticos.', options: ['1, 2 y 3 son correctas.', '1, 3 y 4 son correctas.', '2, 3 y 5 son correctas.', '3, 4 y 5 son correctas'], answer: '1, 3 y 4 son correctas.', explanation: 'Respuesta correcta: B) 1, 3 y 4 son correctas <br> Características del Paleolítico: nomadismo, herramientas de piedra/hueso/madera y arte rupestre. Agricultura y ciudades son del Neolítico.', multi: 'OFF', maxSelect: 1 },
            { question: 'Revolución Neolítica <br> Marque la opción que relaciona correctamente una causa con un efecto de la Revolución Neolítica.', options: ['Causa: El desarrollo de la agricultura. Efecto: La transición de sociedades nómadas a sedentarias.', 'Causa: La invención de la escritura. Efecto: La aparición de los primeros homínidos.', 'Causa: El descubrimiento del fuego. Efecto: La formación de los primeros imperios.', 'Causa: La domesticación de animales. Efecto: La extinción de los dinosaurios.'], answer: 'Causa: El desarrollo de la agricultura. Efecto: La transición de sociedades nómadas a sedentarias.', explanation: 'Respuesta correcta: A <br> La agricultura permitió el sedentarismo. Las demás relaciones son incorrectas (escritura no causa homínidos, fuego no causa imperios, domesticación no extinguió dinosaurios).', multi: 'OFF', maxSelect: 1 },
            { question: 'Conceptos de Historia e Historiografía <br> Relacione los siguientes conceptos con sus respectivas definiciones <br> Conceptos: <br> 1. Historia (como narración) <br> 2. Historia (como disciplina) <br> 3. Historiografía <br> Definiciones: <br> a) Estudio académico de hechos significativos con análisis riguroso de fuentes. <br> b) Narración de todos los eventos del pasado, abarcando el diario vivir humano. <br> c) Estudio de cómo se construye e interpreta la historia, analizando el contexto del historiador. <br> d) Conjunto de leyes que rigen la investigación histórica.', options: ['1a, 2b, 3c', '1c, 2a, 3b', '1b, 2c, 3a', '1b, 2a, 3c'], answer: '1b, 2a, 3c', explanation: 'Respuesta correcta: D) 1b, 2a, 3c <br> 1. Historia como narración = b (relato de eventos). <br> 2. Historia como disciplina = a (estudio académico riguroso). <br> 3. Historiografía = c (estudio de cómo se escribe e interpreta la historia).', multi: 'OFF', maxSelect: 1 },
            { question: 'Evolución de los Homínidos <br> Un paleontólogo descubre un fósil con una capacidad craneal de 800 cm³, acompañado de herramientas de piedra rudimentarias, en un yacimiento africano de 2.2 millones de años. ¿A qué especie pertenece?', options: ['Homo erectus.', 'Homo habilis.', 'Homo ergaster.', 'Australopithecus afarensis.'], answer: 'Homo habilis.', explanation: 'Respuesta correcta: B) Homo habilis <br> Capacidad craneal ~500-800 cm³, herramientas rudimentarias (Oldowan) y edad ~2.2 Ma coinciden con Homo habilis.', multi: 'OFF', maxSelect: 1 },
            { question: 'Características del Homo erectus <br> Sobre el Homo erectus, es INCORRECTO afirmar que:', options: ['Fue la primera especie en domesticar el fuego.', 'Colonizó Asia y habitó allí hasta hace 300.000 años.', 'Desarrolló un lenguaje articulado para organizar estructuras sociales.', 'Fue la primera especie del género Homo en salir de África.'], answer: 'Desarrolló un lenguaje articulado para organizar estructuras sociales.', explanation: 'Respuesta correcta: C (es lo INCORRECTO) <br> Homo erectus dominó el fuego, salió de África y colonizó Asia, pero no hay evidencia clara de lenguaje articulado complejo como el de H. sapiens.', multi: 'OFF', maxSelect: 1 },
            { question: 'Edad de los Metales <br> Lea los siguientes enunciados sobre la Edad de los Metales y seleccione la opción que los clasifique correctamente como verdaderos (V) o falsos (F). <br> 1. La Edad de los Metales siguió a la Edad de Piedra y abarcó del 5000 al 1000 a.C. <br> 2. La primera fase de la Edad de los Metales fue la Edad del Bronce. <br> 3. La aleación de cobre con estaño produjo el bronce, un material más duro y duradero. <br> 4. El hierro fue el último metal en ser dominado, permitiendo la producción en masa.', options: ['V, F, V, V', 'F, V, V, F', 'V, V, F, V', 'F, F, V, V'], answer: 'V, F, V, V', explanation: 'Respuesta correcta: A) V, F, V, V <br> V – Siguió a la Edad de Piedra (~5000-1000 a.C. aproximado). <br> F – La primera fase fue la Edad del Cobre (Calcolítico), luego Bronce y Hierro. <br> V – Bronce = cobre + estaño. <br> V – El hierro fue el último en dominarse.', multi: 'OFF', maxSelect: 1 },
            { question: 'Características del Neolítico <br> Según la información sobre el Neolítico, ¿cuál fue la principal transformación que ocurrió en este período?', options: ['El desarrollo de herramientas de piedra para la caza.', 'La aparición de los primeros homínidos en África.', 'La transición de sociedades nómadas a comunidades sedentarias.', 'La invención de la escritura cuneiforme.'], answer: 'La transición de sociedades nómadas a comunidades sedentarias.', explanation: 'Respuesta correcta: C <br> La principal transformación del Neolítico fue el paso de sociedades nómadas a sedentarias (Revolución Neolítica).', multi: 'OFF', maxSelect: 1 },
            { question: 'Cronoespecies <br> Lea el siguiente texto y responda la pregunta. <br> ´´Cuando se consideraba que el proceso evolutivo de la humanidad fue lineal, se puso en boga la teoría de ´eslabón perdido´; pero, hoy en día se entiende que no existió ningún eslabón; sino, cronoespecies, que hace referencia a la convivencia de diferentes formas evolutivas del mismo o diferente género en los diferentes periodos.´´ <br> ¿Qué concepto reemplazó a la teoría del "eslabón perdido"?', options: ['La teoría de la selección natural.', 'El concepto de cronoespecies.', 'La teoría del Big Bang.', 'El concepto de deriva continental.'], answer: 'El concepto de cronoespecies.', explanation: 'Respuesta correcta: B <br> El texto indica explícitamente que el concepto de cronoespecies reemplazó a la idea del ´´eslabón perdido´´.', multi: 'OFF', maxSelect: 1 },
            { question: 'Características del Australopithecus <br> El Australopithecus es considerado un antepasado del género Homo. ¿Cuál de las siguientes características corresponde a esta especie?', options: ['Tenía un lenguaje articulado y estructura social compleja.', 'Colonizó Asia y Europa.', 'Fabricaba herramientas de piedra avanzadas.', 'Era bípedo facultativo y tenía aspecto simiesco.'], answer: 'Era bípedo facultativo y tenía aspecto simiesco.', explanation: 'Respuesta correcta: D <br> Australopithecus era bípedo facultativo con aspecto simiesco. No tenía lenguaje articulado, no colonizó Eurasia ni fabricaba herramientas avanzadas.', multi: 'OFF', maxSelect: 1 },
            { question: 'Especies del Género Homo <br> Seleccione dos opciones que correspondan a especies del género Homo que coexistieron en el tiempo. <br> 1. Homo habilis y Homo rudolfensis. <br> 2. Homo sapiens y Homo neanderthalensis. <br> 3. Australopithecus afarensis y Homo erectus. <br> 4. Homo ergaster y Homo antecessor.', options: ['1 y 2 son correctas.', '1 y 3 son correctas.', '2 y 4 son correctas.', '3 y 4 son correctas.'], answer: '1 y 2 son correctas.', explanation: 'Respuesta correcta: A) 1 y 2 son correctas <br> H. habilis y H. rudolfensis coexistieron; H. sapiens y H. neanderthalensis también. Australopithecus afarensis es mucho más antiguo que H. erectus.', multi: 'OFF', maxSelect: 1 },
            { question: 'Características del Homo sapiens <br> Seleccione las tres opciones que corresponden a características del Homo sapiens. <br> 1. Apareció en África hace aproximadamente 315.000 a 100.000 años. <br> 2. Fue la primera especie en domesticar el fuego. <br> 3. Desarrolló manifestaciones culturales y expresiones de racionalidad. <br> 4. Colonizó casi todo el mundo y extinguió a otras especies de Homo. <br> 5. Tenía una capacidad craneal de 800 cm<sup>3</sup> .', options: ['1, 2 y 3 son correctas.', '2, 3 y 5 son correctas.', '1, 3 y 4 son correctas.', '3, 4 y 5 son correctas.'], answer: '1, 3 y 4 son correctas.', explanation: 'Respuesta correcta: C) 1, 3 y 4 son correctas <br> H. sapiens aparece en África (~300-100 ka), desarrolló cultura y racionalidad, colonizó el mundo y contribuyó a la extinción de otras especies de Homo. No fue el primero en domesticar el fuego ni tenía solo 800 cm³ de capacidad craneal.', multi: 'OFF', maxSelect: 1 },
            { question: 'Evolución del Género Homo <br> Marque la opción que relaciona correctamente una causa con un efecto en la evolución del género Homo.', options: ['Causa: El Homo ergaster salió de África. Efecto: Colonizó Europa y Asia, dando origen a nuevas especies.', 'Causa: El dominio del fuego. Efecto: El Australopithecus se volvió bípedo.', 'Causa: El desarrollo de herramientas. Efecto: El Homo sapiens se extinguió.', 'Causa: La glaciación. Efecto: El Homo habilis desarrolló el lenguaje articulado.'], answer: 'Causa: El Homo ergaster salió de África. Efecto: Colonizó Europa y Asia, dando origen a nuevas especies.', explanation: 'Respuesta correcta: A <br> Homo ergaster salió de África y dio origen a formas en Eurasia (H. erectus, etc.). Las demás relaciones son falsas.', multi: 'OFF', maxSelect: 1 },
            { question: 'Capas de la Atmósfera <br> Relacione las siguientes capas de la atmósfera con sus respectivas características. <br> Capas: <br> 1. Troposfera <br> 2. Estratosfera <br> 3. Termosfera <br> Características: <br> a) Alberga la capa de ozono que filtra la radiación ultravioleta. <br> b) Ocurren las lluvias, tormentas y contiene el 75% de la masa gaseosa. <br> c) Se generan las auroras polares y orbitan satélites. <br> d) Es la capa más fría, donde se desintegran los meteoritos.', options: ['1b, 2a, 3c', '1a, 2b, 3c', '1c, 2a, 3b', '1b, 2c, 3a'], answer: '1b, 2a, 3c', explanation: 'Respuesta correcta: A) 1b, 2a, 3c <br> Troposfera: lluvias, tormentas, 75 % de la masa. <br> Estratosfera: capa de ozono. <br> Termosfera: auroras y satélites.', multi: 'OFF', maxSelect: 1 },
            { question: 'Eras Geológicas <br> Un geólogo está estudiando una capa rocosa que contiene fósiles de dinosaurios y evidencia de un impacto extraterrestre. ¿A qué era geológica corresponde este hallazgo?', options: ['Precámbrico.', 'Paleozoico.', 'Mesozoico.', 'Cenozoico.'], answer: 'Mesozoico.', explanation: 'Respuesta correcta: C) Mesozoico <br> Dinosaurios + evidencia de impacto = final del Cretácico (Mesozoico).', multi: 'OFF', maxSelect: 1 },
            { question: 'Características del Paleolítico Inferior <br> Sobre el Paleolítico Inferior, es incorrecto afirmar que:', options: ['La caza, la pesca y la recolección eran actividades primordiales.', 'Se fabricaban armas y utensilios con piedra, huesos y marfil.', 'Los seres humanos ya practicaban la agricultura y la ganadería.', 'Hombres y mujeres desempeñaban roles cruciales para la supervivencia.'], answer: 'Los seres humanos ya practicaban la agricultura y la ganadería.', explanation: 'Respuesta correcta: C (es lo INCORRECTO) <br> En el Paleolítico Inferior no había agricultura ni ganadería (esas son del Neolítico).', multi: 'OFF', maxSelect: 1 },

            { question: 'Relaciona los siguientes términos con su definición correcta: <br> <img src="https://i.ibb.co/ZRJBxJBR/Captura-de-pantalla-2026-10-06-154620.png" alt="Descripción de la imagen" width="480" height="200">', options: ['A4; B1; C2; D3', 'A1; B2; C4; D3', 'A4; B3; C2; D1', 'A3; B1; C2; D4'], answer: 'A4; B1; C2; D3', explanation: 'Australopithecus fue uno de los primeros homínidos bípedos, Homo habilis usaba herramientas de piedra, Homo erectus salió de África, y Homo sapiens desarrolló el lenguaje y habilidades cognitivas avanzadas.', multi: 'OFF', maxSelect: 1 },
            { question: '¿Cuál de los siguientes es un factor clave en la evolución del cerebro humano?', options: ['La agricultura.', 'La fabricación de herramientas.', 'El consumo de carne.', 'El bipedismo.'], answer: 'El consumo de carne.', explanation: 'El consumo de carne jugó un papel crucial en la evolución del cerebro humano. La carne es una fuente rica en proteínas y nutrientes esenciales como los ácidos grasos omega-3, que son fundamentales para el desarrollo cerebral. Además, una dieta rica en calorías permitía que los primeros humanos dedicaran más energía al crecimiento del cerebro, lo que facilitó la expansión y complejidad de este órgano a lo largo de la evolución.', multi: 'OFF', maxSelect: 1 },
            { question: 'La __________ se refiere al periodo anterior a la invención de la escritura, donde las sociedades eran principalmente nómadas y vivían de la caza y la recolección.', options: ['Edad Antigua', 'Prehistoria', 'Edad Media', 'Edad Moderna'], answer: 'Prehistoria', explanation: 'La Prehistoria se refiere al periodo anterior a la invención de la escritura, que comenzó hace unos 5,000 años. Durante la Prehistoria, las sociedades humanas eran principalmente nómadas y se dedicaban a la caza, la pesca y la recolección de alimentos. Este periodo abarca varias etapas, como el Paleolítico, el Mesolítico y el Neolítico, antes del desarrollo de la agricultura y la vida sedentaria..', multi: 'OFF', maxSelect: 1 },
            { question: 'Ordena los siguientes homínidos en la secuencia correcta de aparición: <br> 1) Homo sapiens <br> 2) Homo habilis <br> 3) Australopithecus <br> 4) Homo erectus ', options: ['3, 2, 4, 1', '2, 3, 1, 4', '3, 1, 2, 4', '1, 3, 2, 4'], answer: '3, 2, 4, 1', explanation: 'Australopithecus: Apareció hace aproximadamente 4 millones de años y es considerado uno de los primeros ancestros de los humanos. <br> Homo habilis: Surgió hace unos 2,4 millones de años y se destaca por el uso temprano de herramientas de piedra. <br> Homo erectus: Apareció hace alrededor de 1,9 millones de años y fue uno de los primeros en salir de África. <br> Homo sapiens: Surgió hace aproximadamente 300,000 años y es la especie humana actual.', multi: 'OFF', maxSelect: 1 },
            { question: '¿Cuál fue el cambio principal en la anatomía que permitió a los homínidos caminar erguidos?', options: ['La reducción del tamaño de los dientes.', 'La modificación de la pelvis y la columna vertebral.', 'El crecimiento del cráneo.', 'La aparición de la capacidad de fabricar herramientas.'], answer: 'La modificación de la pelvis y la columna vertebral.', explanation: 'El cambio principal en la anatomía que permitió a los homínidos caminar erguidos fue la modificación de la pelvis y la columna vertebral. La pelvis se ensanchó y adoptó una forma más corta y ancha para sostener mejor el peso del cuerpo al estar de pie, mientras que la columna vertebral desarrolló una curvatura que ayudaba a mantener el equilibrio. Estos cambios estructurales permitieron una locomoción bípeda más eficiente.', multi: 'OFF', maxSelect: 1 },

        const trustedProviders = [
            'gmail.com','googlemail.com','hotmail.com','hotmail.es','hotmail.co.uk','outlook.com',

        function isValidEmailFormat(email) {
            const re = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/;
            return re.test(email) && email.length <= 254 && !email.includes('..') && !email.startsWith('.') && !email.endsWith('.');
        }

        function analyzeEmail(email) {
            const lower = email.toLowerCase().trim();
            if (!lower) {
                return { valid: false, msg: 'Escribe un correo electrónico.' };
            }
            if (!isValidEmailFormat(lower)) {
                return { valid: false, msg: 'Formato inválido. Revisa que tenga @ y un dominio correcto.' };
            }
            const domain = lower.split('@')[1];
            if (!domain || domain.length < 3) {
                return { valid: false, msg: 'Dominio incompleto o inválido.' };
            }
            if (disposableDomains.some(d => domain === d || domain.endsWith('.' + d))) {
                return { valid: false, msg: 'Correo temporal / desechable detectado. Usa un correo real.' };
            }
            const isTrusted = trustedProviders.some(p => domain === p);
            const hasGoodTld = /\.(com|es|net|org|edu|gov|mx|ar|co|uk|de|fr|it|pt|br|cl)$/i.test(domain);
            if (!hasGoodTld && !isTrusted) {
                return { valid: false, msg: 'Dominio poco común o sospechoso. Usa Gmail, Hotmail/Outlook, Yahoo, etc.' };
            }
            let analysisText = '';
            if (domain.includes('hotmail') || domain.includes('outlook') || domain.includes('live.com') || domain.includes('msn.com')) {
                analysisText = 'Análisis: proveedor Microsoft (Hotmail/Outlook) detectado · formato correcto · dominio legítimo';
            } else if (domain.includes('gmail') || domain.includes('googlemail')) {
                analysisText = 'Análisis: proveedor Google (Gmail) detectado · formato correcto · dominio legítimo';
            } else if (isTrusted) {
                analysisText = 'Análisis: proveedor conocido · formato correcto · dominio legítimo';
            } else {
                analysisText = 'Análisis: formato válido · dominio con TLD estándar · no se detectaron patrones de correo temporal';
            }
            return { valid: true, msg: analysisText };
        }

        // ---------- LÓGICA DE RESPUESTAS (single + multi) ----------
        function isMultiQuestion(q) {
            return q.multi === 'ON';
        }

        function arraysEqual(a, b) {
            if (!Array.isArray(a) || !Array.isArray(b)) return false;
            if (a.length !== b.length) return false;
            const sa = [...a].sort();
            const sb = [...b].sort();
            return sa.every((v, i) => v === sb[i]);
        }

        function handleAnswer(option) {
            // Ya se comprobó la respuesta → no permitir más cambios
            if (state.isAnswerCorrect !== null) return;

            const currentQ = state.activeQuestions[state.currentQuestion];

            if (isMultiQuestion(currentQ)) {
                // Selección múltiple: toggle
                let selected = Array.isArray(state.selectedAnswer) ? [...state.selectedAnswer] : [];
                const idx = selected.indexOf(option);

                if (idx > -1) {
                    selected.splice(idx, 1); // deseleccionar
                } else {
                    if (selected.length >= currentQ.maxSelect) return; // límite alcanzado
                    selected.push(option);
                }
                state.selectedAnswer = selected;
                render();
            } else {
                // Selección simple (incluye preguntas V/F)
                if (state.selectedAnswer !== null) return;
                state.selectedAnswer = option;
                state.isAnswerCorrect = (option === currentQ.answer);
                if (state.isAnswerCorrect) state.score++;
                render();
                if (state.isAnswerCorrect) {
                    setTimeout(() => nextQuestion(), 1000);
                }
            }
        }

        function checkMultiAnswer() {
            if (state.isAnswerCorrect !== null) return;

            const currentQ = state.activeQuestions[state.currentQuestion];
            if (!isMultiQuestion(currentQ)) return;

            const selected = Array.isArray(state.selectedAnswer) ? state.selectedAnswer : [];
            if (selected.length === 0) return;

            // Comparación exacta (mismo conjunto de respuestas)
            const correctAnswers = Array.isArray(currentQ.answer) ? currentQ.answer : [currentQ.answer];
            state.isAnswerCorrect = arraysEqual(selected, correctAnswers);

            if (state.isAnswerCorrect) state.score++;
            render();

            if (state.isAnswerCorrect) {
                setTimeout(() => nextQuestion(), 1000);
            }
        }

        function nextQuestion() {
            if (state.currentQuestion + 1 < state.activeQuestions.length) {
                state.currentQuestion++;
                state.selectedAnswer = null;
                state.isAnswerCorrect = null;
                render();
            } else {
                state.view = 'results';
                render();
                enviarCorreo();
            }
        }

                const multi = isMultiQuestion(q);
                const selected = multi
                    ? (Array.isArray(state.selectedAnswer) ? state.selectedAnswer : [])
                    : (state.selectedAnswer ? [state.selectedAnswer] : []);

                // Indicador de selección múltiple (CORREGIDO)
                const multiHint = multi
                    ? `<p class="text-sm text-sky-600 font-semibold mb-4">
                         Selección múltiple · elige q.maxSelectrespuesta{q.maxSelect > 1 ? 's' : ''}
                         ${selected.length > 0 ? `(${selected.length}/${q.maxSelect})` : ''}
                       </p>`
                    : '';

                app.innerHTML = `
                <div class="animate-fade-in">
                    <div class="flex justify-between items-center mb-6 px-4">
                        <span class="font-black text-emerald-600">${state.currentQuestion + 1} / ${state.activeQuestions.length}</span>
                        <div class="w-48 bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-emerald-500 h-full transition-all" style="width:${progress}%"></div>
                        </div>
                    </div>
                    <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-xl border">
                        <h2 class="text-2xl font-bold text-slate-800 mb-2 leading-tight">${q.question}</h2>
                        ${multiHint}
                        <div class="grid gap-3">
                            ${q.options.map(opt => {
                                let style = "border-slate-100 bg-slate-50 hover:border-emerald-200";
                                const isSelected = selected.includes(opt);

                                if (state.isAnswerCorrect !== null) {
                                    // Ya se comprobó → mostrar feedback final
                                    if (multi) {
                                        const correctSet = Array.isArray(q.answer) ? q.answer : [q.answer];
                                        if (correctSet.includes(opt) && isSelected) {
                                            style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                        } else if (isSelected && !correctSet.includes(opt)) {
                                            style = "border-red-500 bg-red-100 text-red-800";
                                        } else if (correctSet.includes(opt) && !isSelected) {
                                            style = "border-emerald-300 bg-emerald-50 text-emerald-700";
                                        }
                                    } else {
                                        // Selección simple (incluye V/F) - muestra la correcta en verde
                                        if (opt === q.answer) {
                                            style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                        } else if (isSelected) {
                                            style = "border-red-500 bg-red-100 text-red-800";
                                        }
                                    }
                                } else if (isSelected) {
                                    // Selección en curso
                                    if (multi) {
                                        style = "border-sky-400 bg-sky-100 text-sky-800";
                                    } else {
                                        style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                    }
                                }

                                // Escapar comillas y barras para el atributo onclick
                                const safeOpt = opt.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

                                return `<button onclick="handleAnswer('${safeOpt}')" 
                                            class="p-5 text-left border-2 rounded-xl font-bold transition-all ${style}">
                                            ${opt}
                                        </button>`;
                            }).join('')}
                        </div>

                        ${/* Botón comprobar (solo multi y aún no comprobado) - CORREGIDO */
                          multi && state.isAnswerCorrect === null ? `
                            <button onclick="checkMultiAnswer()" 
                                class="mt-6 w-full py-4 rounded-xl font-bold transition-all
                                ${selected.length === q.maxSelect 
                                    ? 'bg-sky-600 text-white hover:bg-sky-700' 
                                    : 'bg-slate-200 text-slate-400 cursor-not-allowed'}"
                                ${selected.length !== q.maxSelect ? 'disabled' : ''}>
                                Comprobar respuesta (selected.length/{q.maxSelect})
                            </button>
                          ` : ''}

                        ${/* Explicación + siguiente (cuando falló) */
                          state.selectedAnswer !== null && state.isAnswerCorrect === false ? `
                            <div class="mt-6 p-5 bg-amber-50 border border-amber-200 rounded-xl">
                                <p class="font-bold text-amber-800 mb-2">Explicación:</p>
                                <p class="text-slate-700">${q.explanation}</p>
                            </div>
                            <button onclick="nextQuestion()" class="mt-6 w-full bg-emerald-600 text-white py-4 rounded-xl font-bold hover:bg-emerald-700 transition-all">
                                Siguiente pregunta
                            </button>
                          ` : ''}
                    </div>
                </div>`;
            }

            if (state.view === 'results') {
                const scorePerc = Math.round((state.score / state.activeQuestions.length) * 100);
                app.innerHTML = `
                <div class="max-w-md mx-auto text-center animate-fade-in bg-white p-12 rounded-[3rem] shadow-2xl">
                    <h2 class="text-2xl font-black mb-2">${state.studentName}</h2>
                    <p class="text-slate-400 uppercase text-xs font-bold mb-6">${state.currentMode}</p>
                    <div class="text-7xl font-black text-emerald-600 mb-4">${scorePerc}%</div>
                    <p class="text-lg font-bold text-slate-700 mb-10">${state.score} / ${state.activeQuestions.length} correctas</p>
                    <button onclick="location.reload()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold">VOLVER AL INICIO</button> 
                    <p class="mt-6 text-xs font-bold text-slate-400"> 
                        ${state.emailStatus === 'success' ? '✅ Nota e imagen enviadas al correo' : 
                          state.emailStatus === 'error' ? '⚠️ Error al enviar nota e imagen' : 
                          '⏳ Enviando nota e imagen al correo...'}
                    </p>
                </div>`;
            }
        }
        render();
    </script>
</body>
</html>
